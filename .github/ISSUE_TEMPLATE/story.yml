name: Story
description: New work with testable acceptance criteria
labels: [feat]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: Who benefits, what they get, and why it matters.
      placeholder: As a <role>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes a reviewer can test. The issue is done when all are ticked.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, out of scope.
