name: ci

on:
  # `edited` matters: a retitle changes the commit message a squash merge will
  # write, so the title gate has to run again.
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  # release-please.yml dispatches this workflow on the release branch, so the
  # release pull request carries checks without a PAT.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Every run, a retitle included, builds the head commit in full: a skipped
  # job counts as passing a required check, so no run may skip the build.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The same set release-please-config.json gives a changelog section.
          types: |
            feat
            fix
            perf
            refactor
            docs
            ci
            chore
            test
            build
            revert
          requireScope: false
          # A changelog line reads as prose, so the subject starts lowercase.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: >-
            The subject "{subject}" of pull request "{title}" starts with an
            uppercase letter. Conventional Commit subjects are lowercase.

  check:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    services:
      # Tests that need Postgres (lib/test-db.ts) run when TEST_DATABASE_URL is set.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: fonts/slide
          key: slide-fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - run: sh scripts/fetch-fonts.sh
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  compose:
    name: Image and compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t ghcr.io/zyx1121/slide:ci .
      - name: Start the stack from .env.example
        run: |
          sed -e 's/^SLIDE_VERSION=.*/SLIDE_VERSION=ci/' \
              -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres/' \
              -e 's|^OIDC_ISSUER=.*|OIDC_ISSUER=http://127.0.0.1:9/realms/ci|' \
              -e 's/^OIDC_CLIENT_ID=.*/OIDC_CLIENT_ID=slide/' \
              -e 's/^OIDC_CLIENT_SECRET=.*/OIDC_CLIENT_SECRET=ci-secret/' \
              -e 's/^ALLOWED_EMAILS=.*/ALLOWED_EMAILS=ci@example.org/' \
              -e "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" \
              .env.example > .env
          docker compose up -d
      - name: Smoke test
        run: sh scripts/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs
