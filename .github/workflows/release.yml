name: release

# Every push to main publishes ghcr.io/zyx1121/slide:sha-<commit>
# (immutable) and :main, for amd64 only: that is what deploys run, and the
# emulated arm64 build took most of the time between a merge and its deploy.
# Releases (release-please.yml) publish the SemVer tags and :latest for amd64
# and arm64, because a tag pushed with GITHUB_TOKEN starts no workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Pushes publish in order, so an older run never overwrites a newer :main.
concurrency:
  group: release-image-main
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
