name: release

# Every push to main deploys the image ci passed to VM 117 through land:
# ship retags tree-<tree> as sha-<commit> and main, then carrel-deployd on
# the VM runs deploy/carrel-start.sh. Releases (release-please.yml) publish
# the SemVer tags and :latest.
on:
  push:
    branches: [main]

jobs:
  ship:
    uses: zyx1121/.github/.github/workflows/ship.yml@main
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
    with:
      images: '["ghcr.io/zyx1121/slide"]'
      target: land
      tenant: compose
      app: slide
